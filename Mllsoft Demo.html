<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M@llsoft Demo</title>
<meta name="description" content="เดโมระบบลงเวลาพนักงานขาย M@llsoft ทุกบทบาท ใช้ข้อมูลสมมุติ มือถือ 1 จอ แท็บเล็ต 2 จอ ทำงานเชื่อมกัน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #E7E8EC; --shell: #1F1F23; --shell-ink: #F4F4F5; --brand: #EA580C; --brand-ink: #9A3412; --brand-soft: #FFF0E6;
  --app-bg: #F1F5F9; --card: #FFFFFF; --ink: #0F172A; --muted: #64748B; --line: #E2E8F0;
  --pri: #059669; --pri-ink: #FFFFFF; --pri-soft: #D1FAE5; --pri-dark: #047857;
  --blue: #2563EB; --blue-soft: #DBEAFE; --amber: #B45309; --amber-soft: #FEF3C7; --red: #DC2626; --red-soft: #FEE2E2;
  --violet: #7C3AED; --violet-soft: #EDE9FE;
  --chat-bg: #8FA9CF; --radius: 16px;
  --top-h: 56px; --pane-h: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans Thai', 'Leelawadee UI', 'Noto Sans Thai', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- presenter shell ---------- */
.top { height: var(--top-h); background: var(--shell); color: var(--shell-ink); display: flex; align-items: center; gap: 12px; padding: 0 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.top .logo { font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; white-space: nowrap; }
.top .logo b { color: #FDBA74; }
.top .sub { font-size: .8rem; color: #A1A1AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .tag { font-size: .7rem; font-weight: 600; background: #3F3F46; color: #FDE68A; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.top .sp { flex: 1; }
.seg { display: inline-flex; background: #3F3F46; border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: #D4D4D8; font-size: .78rem; font-weight: 600; border-radius: 8px; padding: 6px 10px; min-height: 32px; }
.seg button[aria-pressed="true"] { background: #FFFFFF; color: var(--shell); }
.tbtn { border: 1px solid #52525B; background: transparent; color: #E4E4E7; border-radius: 10px; padding: 6px 12px; font-size: .78rem; font-weight: 600; min-height: 36px; white-space: nowrap; }
.tbtn:hover { background: #3F3F46; }
.scen { display: flex; gap: 8px; align-items: center; padding: 8px 16px; overflow-x: auto; background: #FAFAFA; border-bottom: 1px solid #D4D4D8; scrollbar-width: none; }
.scen::-webkit-scrollbar { display: none; }
.scen > span { font-size: .75rem; color: #52525B; white-space: nowrap; font-weight: 600; }
.scen button { border: 1px solid #D4D4D8; background: #FFFFFF; border-radius: 999px; padding: 5px 12px; font-size: .76rem; white-space: nowrap; min-height: 32px; }
.scen button:hover { border-color: var(--brand); color: var(--brand-ink); }
.scen .tip { font-size: .76rem; color: var(--brand-ink); white-space: nowrap; }

.stage { height: calc(100dvh - var(--top-h) - 49px); display: grid; gap: 20px; padding: 14px 20px 16px; justify-content: center; }
.stage.two { grid-template-columns: repeat(2, minmax(0, 430px)); }
.stage.one { grid-template-columns: minmax(0, 430px); }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pane[hidden] { display: none; }
.pane-head { height: var(--pane-h); display: flex; align-items: center; gap: 8px; }
.pane-head .pl { font-size: .72rem; font-weight: 700; color: #71717A; background: #FFFFFF; border-radius: 8px; padding: 4px 8px; }
.roles { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.roles::-webkit-scrollbar { display: none; }
.roles button { border: 1px solid #D4D4D8; background: #FFFFFF; border-radius: 999px; padding: 5px 11px; font-size: .76rem; font-weight: 600; white-space: nowrap; min-height: 34px; color: #3F3F46; }
.roles button[aria-pressed="true"] { background: var(--shell); border-color: var(--shell); color: #FFFFFF; }
.role-select { display: none; flex: 1; border: 1px solid #D4D4D8; border-radius: 10px; padding: 6px 10px; background: #FFFFFF; min-height: 38px; font-weight: 600; }

.device { position: relative; flex: 1; min-height: 0; background: #111114; border-radius: 34px; padding: 9px; box-shadow: 0 18px 40px rgba(15, 23, 42, .18); }
.screen-wrap { position: relative; height: 100%; border-radius: 26px; overflow: hidden; background: var(--app-bg); display: flex; flex-direction: column; }
.liffbar { flex: 0 0 auto; height: 38px; background: #FFFFFF; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: .78rem; color: #334155; }
.liffbar b { font-weight: 600; }
.liffbar span { color: #94A3B8; font-size: .9rem; }

/* ---------- app (เลียนแบบหน้า LINE LIFF จริง) ---------- */
.app-head { flex: 0 0 auto; background: var(--pri); color: #FFFFFF; padding: 10px 14px 12px; }
.app-head .co { font-size: .72rem; opacity: .9; }
.app-head .who { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.app-head .who b { font-size: .98rem; }
.app-head .rb { font-size: .68rem; font-weight: 700; background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 8px; }
.app-head .clock { margin-left: auto; font-size: .78rem; opacity: .95; }
.tabbar { flex: 0 0 auto; display: flex; gap: 4px; padding: 6px; background: #FFFFFF; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button { position: relative; flex: 0 0 auto; border: 0; background: transparent; border-radius: 12px; padding: 7px 12px; font-size: .8rem; font-weight: 600; color: var(--muted); min-height: 38px; white-space: nowrap; }
.tabbar button[aria-selected="true"] { background: var(--pri); color: #FFFFFF; }
.badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #FFFFFF; font-size: .66rem; line-height: 18px; text-align: center; }
.scr { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.scr.chat { background: var(--chat-bg); }
.bottom { flex: 0 0 auto; padding: 10px 12px; background: #FFFFFF; border-top: 1px solid var(--line); }

.card { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
.card h3 { margin: 0 0 8px; font-size: .9rem; }
.row { display: flex; align-items: center; gap: 8px; }
.row.sb { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .76rem; }
.xs { font-size: .7rem; }
.btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: .88rem; min-height: 44px; background: #F1F5F9; color: var(--ink); }
.btn.pri { background: var(--pri); color: #FFFFFF; }
.btn.pri:disabled { background: #A7F3D0; color: #FFFFFF; cursor: not-allowed; }
.btn.dark { background: #1E293B; color: #FFFFFF; }
.btn.blue { background: var(--blue); color: #FFFFFF; }
.btn.red { background: var(--red-soft); color: var(--red); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: .78rem; border-radius: 10px; }
.btn.block { width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: .7rem; font-weight: 700; white-space: nowrap; }
.p-ok { background: var(--pri-soft); color: var(--pri-dark); }
.p-blue { background: var(--blue-soft); color: #1D4ED8; }
.p-amber { background: var(--amber-soft); color: var(--amber); }
.p-red { background: var(--red-soft); color: var(--red); }
.p-mute { background: #F1F5F9; color: #475569; }
.p-violet { background: var(--violet-soft); color: var(--violet); }
.switch { display: grid; grid-template-columns: 1fr 1fr; background: #E2E8F0; border-radius: 12px; padding: 3px; gap: 3px; }
.switch button { border: 0; background: transparent; border-radius: 10px; padding: 8px; font-weight: 600; font-size: .84rem; min-height: 40px; color: #475569; }
.switch button[aria-pressed="true"] { background: #FFFFFF; color: var(--pri-dark); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.photo { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; background: #E2E8F0; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #94A3B8; font-size: .8rem; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
label.f { display: grid; gap: 4px; font-size: .78rem; font-weight: 600; color: #334155; }
.inp { width: 100%; border: 1px solid #CBD5E1; border-radius: 12px; padding: 9px 12px; background: #FFFFFF; font-size: .88rem; min-height: 42px; }
textarea.inp { min-height: 64px; resize: vertical; }
.kpi { background: #F8FAFC; border-radius: 12px; padding: 8px 10px; }
.kpi span { display: block; font-size: .68rem; color: var(--muted); }
.kpi b { font-size: 1.15rem; }
.list { display: grid; }
.list > * + * { border-top: 1px solid var(--line); }
.li { padding: 9px 0; display: flex; gap: 10px; align-items: center; font-size: .82rem; }
.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: 0 0 44px; background: #E2E8F0; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 6px 12px; font-size: .74rem; font-weight: 600; background: #FFFFFF; color: #475569; box-shadow: 0 1px 2px rgba(15,23,42,.06); min-height: 34px; }
.chip[aria-pressed="true"] { background: #1E293B; color: #FFFFFF; }
.prod { background: #FFFFFF; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
.prod .pic { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; }
.prod .pb { padding: 8px 10px 10px; display: grid; gap: 3px; font-size: .74rem; }
.prod .pb b { font-size: .8rem; line-height: 1.3; }
.qty { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; border: 1px solid #CBD5E1; border-radius: 10px; overflow: hidden; margin-top: 4px; }
.qty button { border: 0; background: #F8FAFC; height: 34px; font-size: 1rem; font-weight: 700; }
.qty span { text-align: center; font-weight: 700; font-size: .84rem; }
.success-ic { width: 60px; height: 60px; border-radius: 999px; background: var(--pri-soft); color: var(--pri); display: flex; align-items: center; justify-content: center; margin: 0 auto; }
.dl { display: grid; gap: 7px; font-size: .82rem; }
.dl div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.dl dt { color: var(--muted); flex: 0 0 auto; }
.dl dd { margin: 0; font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 999px; background: #E2E8F0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pri); border-radius: 999px; }
table.t { width: 100%; border-collapse: collapse; font-size: .74rem; }
table.t th, table.t td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { color: var(--muted); font-weight: 600; }
.tablebox { overflow-x: auto; }
.msg { display: flex; gap: 8px; align-items: flex-end; }
.msg .av { width: 30px; height: 30px; border-radius: 999px; background: var(--pri); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; flex: 0 0 30px; }
.msg .bub { background: #FFFFFF; border-radius: 16px; border-top-left-radius: 4px; padding: 8px 12px; font-size: .8rem; max-width: 78%; white-space: pre-line; }
.msg .bub.flex { padding: 0; overflow: hidden; min-width: 210px; }
.msg .bub.flex .fh { padding: 10px 12px 6px; font-weight: 700; color: var(--pri-dark); }
.msg .bub.flex .fb { padding: 0 12px 10px; display: grid; gap: 3px; font-size: .74rem; }
.msg .bub.flex .fb div { display: flex; justify-content: space-between; gap: 10px; }
.msg time { font-size: .62rem; color: #F1F5F9; }
.chat-day { align-self: center; font-size: .66rem; background: rgba(15,23,42,.25); color: #FFFFFF; border-radius: 999px; padding: 2px 10px; }

.sheet { position: absolute; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-end; z-index: 20; }
.sheet .sh { background: #FFFFFF; width: 100%; max-height: 88%; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; }
.sheet .sh-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 6px; }
.sheet .sh-h b { font-size: .98rem; }
.sheet .sh-h button { border: 0; background: transparent; width: 40px; height: 40px; font-size: 1.4rem; color: #94A3B8; }
.sheet .sh-b { overflow-y: auto; padding: 4px 16px 18px; display: grid; gap: 10px; }
.toasts { position: absolute; top: 46px; left: 10px; right: 10px; z-index: 30; display: grid; gap: 6px; pointer-events: none; }
.toast { pointer-events: auto; background: #1E293B; color: #FFFFFF; border-radius: 12px; padding: 9px 12px; font-size: .78rem; box-shadow: 0 8px 20px rgba(0,0,0,.2); display: flex; gap: 10px; align-items: center; animation: tin .25s ease-out; }
.toast.ok { background: var(--pri-dark); }
.toast.warn { background: #B45309; }
.toast button { white-space: nowrap; flex: 0 0 auto; margin-left: auto; border: 0; background: rgba(255,255,255,.18); color: #FFFFFF; border-radius: 8px; padding: 4px 10px; font-size: .74rem; font-weight: 600; min-height: 30px; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.flash { animation: fl 1.6s ease-out; }
@keyframes fl { 0% { box-shadow: 0 0 0 3px #FB923C; } 100% { box-shadow: 0 1px 2px rgba(15,23,42,.05); } }
.empty { text-align: center; color: var(--muted); font-size: .8rem; padding: 18px 8px; }
.note-demo { font-size: .68rem; color: #94A3B8; text-align: center; }

/* มือถือ: 1 จอเต็มหน้าจอ ไม่มีกรอบเครื่อง */
@media (max-width: 759px) {
  .top { --top-h: 52px; gap: 8px; padding: 0 12px; }
  .top .sub, .seg { display: none; }
  .scen { padding: 6px 12px; }
  .stage { padding: 0; gap: 0; height: calc(100dvh - 52px - 45px); grid-template-columns: minmax(0, 1fr) !important; }
  .pane[data-pane="B"] { display: none; }
  .pane-head { height: 48px; padding: 0 10px; background: #FFFFFF; border-bottom: 1px solid #D4D4D8; }
  .roles, .pane-head .pl { display: none; }
  .role-select { display: block; }
  .device { border-radius: 0; padding: 0; box-shadow: none; background: transparent; }
  .screen-wrap { border-radius: 0; }
  .liffbar { display: none; }
  .toasts { top: 8px; }
}
@media (prefers-reduced-motion: reduce) { .toast, .flash { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="logo">M<b>@</b>llsoft</div>
  <div class="sub">เดโมระบบลงเวลาพนักงานขาย · ทุกบทบาท · เชื่อมกันทุกหน้าจอ</div>
  <span class="tag">ข้อมูลสมมุติ</span>
  <div class="sp"></div>
  <div class="seg" role="group" aria-label="จำนวนหน้าจอ">
    <button type="button" data-mode="1" aria-pressed="false">1 จอ</button>
    <button type="button" data-mode="2" aria-pressed="true">2 จอ</button>
  </div>
  <button type="button" class="tbtn" id="resetBtn">เริ่มใหม่</button>
</header>
<div class="scen" id="scen">
  <span>ลองสถานการณ์:</span>
  <button type="button" data-scen="order">ขาย สั่งสินค้า → คลังจัดของ</button>
  <button type="button" data-scen="checkin">ขาย ลงเวลา → HR เห็นใน Dashboard</button>
  <button type="button" data-scen="leave">ขาย ขอลา/OT → HR อนุมัติ</button>
  <button type="button" data-scen="exec">HR ↔ ผู้บริหาร: รายงาน</button>
  <button type="button" data-scen="admin">Admin เพิ่มพนักงาน → Dashboard</button>
  <span class="tip" id="tip"></span>
</div>
<main class="stage two" id="stage">
  <section class="pane" data-pane="A" aria-label="หน้าจอที่ 1"></section>
  <section class="pane" data-pane="B" aria-label="หน้าจอที่ 2"></section>
</main>
<script>
/* =====================================================================
 *  M@llsoft Demo — เลียนแบบหน้าจอ LINE (LIFF) ของโปรแกรมจริง v2.1
 *  ทุกหน้าจอใช้ข้อมูลชุดเดียวกัน (DB) แก้ที่จอหนึ่ง อีกจอเปลี่ยนตามทันที
 *  ข้อมูลทั้งหมดเป็นข้อมูลสมมุติเพื่อการทดสอบเท่านั้น
 * ===================================================================== */
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const baht = (n) => '฿' + Math.round(n).toLocaleString('th-TH');
const pad2 = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const tm = (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const thDate = (d, o = { day: 'numeric', month: 'short' }) => new Date(d).toLocaleDateString('th-TH', o);
const thDow = (d) => new Date(d).toLocaleDateString('th-TH', { weekday: 'short' });
const todayKey = () => dayKey(new Date());
const at = (d, h, m) => { const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
let uid = 1000; const nid = (p) => `${p}${++uid}`;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------------------------------------------------------
 *  ค่าคงที่ (ตรงกับโปรแกรมจริง)
 * --------------------------------------------------------------- */
const PURPOSES = ['นำเสนอสินค้าใหม่', 'เยี่ยมเยียนประจำสัปดาห์', 'รับคำสั่งซื้อ', 'เก็บเงิน', 'เคลมสินค้า', 'ตรวจสต็อก / จัดเรียงสินค้า'];
const LEAVE = { sick: 'ลาป่วย', personal: 'ลากิจ', vacation: 'ลาพักร้อน' };
const REQ = { pending: ['รออนุมัติ', 'p-amber'], approved: ['อนุมัติแล้ว', 'p-ok'], rejected: ['ไม่อนุมัติ', 'p-red'], cancelled: ['ยกเลิก', 'p-mute'] };
const OST = { new: ['ออเดอร์ใหม่', 'p-amber'], confirmed: ['ยืนยันแล้ว', 'p-blue'], picking: ['กำลังจัด', 'p-violet'], shipped: ['จัดส่งแล้ว', 'p-ok'] };
const NEXT = { new: ['confirmed', 'ยืนยันออเดอร์'], confirmed: ['picking', 'เริ่มจัดสินค้า'], picking: ['shipped', 'จัดส่งแล้ว'] };
const SHIFT = { name: 'กะปกติ', start: [8, 30], end: [17, 30], grace: 10, days: [1, 2, 3, 4, 5, 6] };

function addCI(pid, sid, type, t, purpose, R, landmark) {

}
const soNo = (n) => `SO-${new Date().getFullYear() + 543}-${String(n).padStart(5, '0')}`;
const person = (id) => DB.people.find((p) => p.id === id);
const store = (id) => DB.stores.find((s) => s.id === id);
const prod = (id) => DB.products.find((p) => p.id === id);
const placeOf = (c) => c.storeId ? store(c.storeId)?.name : c.landmark;
function unitPrice(p, q) { let u = p.price; (p.tiers || []).forEach(([min, price]) => { if (q >= min) u = price; }); return u; }
function lineOf(gid, q) { const p = prod(gid); const u = unitPrice(p, q); return { gid, name: p.name, unit: p.unit, qty: q, list: p.price, price: u, total: u * q, save: (p.price - u) * q }; }
function pushChat(pid, m, silent) { (DB.chats[pid] ||= []).push({ at: new Date(), ...m }); if (!silent) DB.unread[pid] = (DB.unread[pid] || 0) + 1; }

const IMG = new Map();
function selfie(c) {
  if (c.img) return c.img;
  if (IMG.has(c.id)) return IMG.get(c.id);
  const url = drawSelfie(person(c.pid), c.at, placeOf(c), c.seed || 1);
  IMG.set(c.id, url); return url;
}
function drawSelfie(p, when, place, s) {
  const R = rng(s), w = 240, h = 180, cv = document.createElement('canvas');
  cv.width = w; cv.height = h; const g = cv.getContext('2d');
  const bgs = ['#C7D2FE', '#BBF7D0', '#FDE68A', '#FBCFE8', '#BAE6FD', '#DDD6FE', '#FED7AA'];
  g.fillStyle = bgs[Math.floor(R() * bgs.length)]; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 4; i++) g.fillRect(12 + i * 58, 18 + R() * 20, 40, 52 + R() * 30);   // ชั้นวางสินค้าในร้าน
  g.fillStyle = 'rgba(15,23,42,.10)'; g.fillRect(0, 120, w, 60);
  const skin = ['#F1C27D', '#E0AC69', '#C68642', '#FFDBAC'][Math.floor(R() * 4)];
  g.fillStyle = p?.color || '#0EA5E9'; g.beginPath(); g.ellipse(120, 182, 70, 52, 0, Math.PI, 0); g.fill();         // เสื้อ
  g.fillStyle = skin; g.beginPath(); g.arc(120, 86, 34, 0, Math.PI * 2); g.fill();                                    // หน้า
  g.fillStyle = '#1F2937'; g.beginPath(); g.arc(120, 78, 35, Math.PI * 1.05, Math.PI * 1.95); g.fill();               // ผม
  g.fillStyle = '#1F2937'; g.beginPath(); g.arc(108, 90, 3, 0, 7); g.arc(132, 90, 3, 0, 7); g.fill();
  g.strokeStyle = '#7C2D12'; g.lineWidth = 2; g.beginPath(); g.arc(120, 98, 9, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  g.fillStyle = 'rgba(15,23,42,.72)'; g.fillRect(0, h - 34, w, 34);
  g.fillStyle = '#FFFFFF'; g.font = '600 11px "IBM Plex Sans Thai", sans-serif';
  const d = new Date(when);
  g.fillText(`${thDate(d, { day: 'numeric', month: 'short', year: '2-digit' })} ${tm(d)} · 13.8${Math.floor(100 + R() * 800)}, 100.0${Math.floor(100 + R() * 800)}`, 8, h - 20);
  g.fillText(`${(p?.name || '')} · ${(place || '').slice(0, 22)}`, 8, h - 7);
  return cv.toDataURL('image/jpeg', 0.72);
}
function shrinkFile(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 480 / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = img.width * s; cv.height = img.height * s; cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u); res(cv.toDataURL('image/jpeg', 0.75)); };
    img.onerror = rej; img.src = u;
  });
}

/* ---------------------------------------------------------------
 *  คำนวณเวลา (กติกาเดียวกับรายงานจริง)
 * --------------------------------------------------------------- */
const cisOf = (pid, k) => DB.checkins.filter((c) => c.pid === pid && dayKey(c.at) === k).sort((a, b) => a.at - b.at);
const isWorkday = (d) => SHIFT.days.includes(d.getDay() === 0 ? 7 : d.getDay());
function lateMin(pid, k) { const f = cisOf(pid, k)[0]; if (!f) return 0; const lim = at(f.at, SHIFT.start[0], SHIFT.start[1] + SHIFT.grace); return f.at > lim ? Math.round((f.at - at(f.at, ...SHIFT.start)) / 60000) : 0; }
function onLeave(pid, k) { return DB.requests.find((r) => r.pid === pid && r.kind === 'leave' && r.status === 'approved' && r.start <= k && k <= r.end); }
function otHours(pid, from, to) { return DB.requests.filter((r) => r.pid === pid && r.kind === 'ot' && r.status === 'approved' && r.date >= from && r.date <= to).reduce((s, r) => { const [a, b] = [r.otStart, r.otEnd].map((x) => { const [h, m] = x.split(':').map(Number); return h * 60 + m; }); return s + (b - a) / 60; }, 0); }
function summary(pid, fromK, toK) {
  let work = 0, present = 0, late = 0, lateM = 0, leave = 0, absent = 0, visits = 0;
  for (let d = fromKey(fromK); dayKey(d) <= toK; d = addDays(d, 1)) {
    const k = dayKey(d); if (!isWorkday(d)) continue; work++;
    const cs = cisOf(pid, k);
    if (cs.length) { present++; visits += cs.filter((c) => c.type === 'check_in').length; const l = lateMin(pid, k); if (l) { late++; lateM += l; } }
    else if (onLeave(pid, k)) leave++;
    else if (k < todayKey()) absent++;
  }
  return { work, present, late, lateM, leave, absent, visits, ot: otHours(pid, fromK, toK) };
}

function renderAll(except) {

function render(id) {

    <select class="role-select" data-chg="role" aria-label="เลือกบทบาท">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${p.role === k ? 'selected' : ''}>ดูเป็น: ${r.label} (${esc(person(r.me).name)})</option>`).join('')}</select>`;
  const box = el.querySelector('.content');
  const old = box.querySelector('.scr'); const keep = old && old.dataset.tab === p.tab ? old.scrollTop : 0;
  const badges = { approve: pendingCount(), queue: DB.orders.filter((o) => o.status === 'new').length, chat: DB.unread[me.id] || 0 };
  const view = VIEWS[p.tab](p, me);

      <div class="co">${esc(me.code)} · ${esc(me.region)}</div></div>
    <div class="tabbar" role="tablist">${tabs.map((t) => `<button type="button" role="tab" data-act="tab" data-v="${t}" aria-selected="${p.tab === t}">${TAB_LABEL[t]}${badges[t] && !(t === 'queue' && p.role === 'exec') ? `<span class="badge">${badges[t]}</span>` : ''}</button>`).join('')}</div>
    <div class="scr ${p.tab === 'chat' ? 'chat' : ''}" data-tab="${p.tab}">${view.body}</div>
    ${view.bottom ? `<div class="bottom">${view.bottom}</div>` : ''}
    ${p.ui.sheet ? sheetHTML(p, me) : ''}`;
  const scr = box.querySelector('.scr');
  if (p.tab === 'chat') { scr.scrollTop = scr.scrollHeight; if (DB.unread[me.id]) { DB.unread[me.id] = 0; setTimeout(() => render(id), 0); } }
  else scr.scrollTop = keep;
  const sel = el.querySelector('.tabbar [aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  if (p.flash) { const f = box.querySelector(`[data-flash="${p.flash}"]`); if (f) f.classList.add('flash'); p.flash = null; }
}
const pendingCount = () => DB.requests.filter((r) => r.status === 'pending').length + DB.pendingProducts.length;

function toast(id, text, opts = {}) {
  if (!visiblePanes().includes(id)) return;
  const wrap = $(`[data-pane="${id}"] .toasts`);
  while (wrap.children.length >= 2) wrap.firstElementChild.remove();
  const t = document.createElement('div');
  t.className = 'toast ' + (opts.kind || '');
  t.innerHTML = `<span>${esc(text)}</span>${opts.label ? `<button type="button">${esc(opts.label)}</button>` : ''}`;
  if (opts.label) t.querySelector('button').onclick = () => { t.remove(); opts.fn(); };
  wrap.appendChild(t);
  setTimeout(() => t.remove(), opts.ms || 4200);
}
/** แจ้งจอที่เป็นบุคคลนั้น (ข้อความเข้า LINE จริงในระบบ) */
function notifyPerson(pid, text, chatMsg) {
  if (chatMsg) pushChat(pid, chatMsg);
  visiblePanes().forEach((id) => { const p = PANES[id]; if (ROLES[p.role].me === pid && p.tab !== 'chat') toast(id, text, { label: 'ดูแชท', fn: () => goTab(id, 'chat') }); });
}
/** แจ้งจอตามบทบาท (ในระบบจริง = หน้าจออัปเดตเอง/ตัวเลขบนแท็บ) */
function notifyRoles(roles, text, tab, kind) {
  visiblePanes().forEach((id) => { const p = PANES[id]; if (roles.includes(p.role)) toast(id, text, { label: tab ? 'เปิดดู' : '', fn: () => goTab(id, tab), kind }); });
}
function goTab(id, tab) { const p = PANES[id]; p.tab = tab; p.ui.sheet = null; p.ui.success = null; render(id); }
function openSheet(id, sheet) { PANES[id].ui.sheet = sheet; render(id); }
function closeSheet(id) { PANES[id].ui.sheet = null; render(id); ['A', 'B'].forEach((x) => { if (x !== id && PANES[x].stale && !PANES[x].ui.sheet) render(x); }); }

      const st = last ? (last.type === 'check_in' ? ['อยู่ที่ร้าน', 'p-ok'] : ['ออกจากร้านแล้ว', 'p-blue']) : lv ? [LEAVE[lv.type], 'p-violet'] : ['ยังไม่ลงเวลา', 'p-amber'];

}
async function onChange(id, e) {

}

function scenario(k) {
  const [a, b, tip] = SCEN[k];
  PANES.A = { role: a[0], tab: a[1], ui: {} }; PANES.B = { role: b[0], tab: b[1], ui: {} };
  $$('.toasts').forEach((t) => { t.innerHTML = ''; });
  $('#tip').textContent = isTwo() ? tip : tip.replace(/จอ 2:.*$/, 'แล้วเปลี่ยนบทบาทที่ด้านบนเพื่อดูอีกฝั่ง');
  renderAll();
}
function init() {
  seed(); buildPane('A'); buildPane('B'); layout(); renderAll();
  $('#tip').textContent = isTwo() ? 'แตะปุ่มสถานการณ์ หรือเลือกบทบาทเหนือแต่ละจอ' : 'เลือกบทบาทด้านบน หรือแตะปุ่มสถานการณ์';
  $$('.seg button').forEach((b) => b.addEventListener('click', () => { MODE = b.dataset.mode; layout(); renderAll(); }));
  $('#resetBtn').addEventListener('click', () => { IMG.clear(); seed(); PANES.A = { role: 'sales', tab: 'checkin', ui: {} }; PANES.B = { role: 'warehouse', tab: 'queue', ui: {} }; renderAll(); toast('A', 'เริ่มข้อมูลเดโมใหม่แล้ว', { kind: 'ok' }); });
  $$('#scen [data-scen]').forEach((b) => b.addEventListener('click', () => scenario(b.dataset.scen)));
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const was = $('#stage').className; layout(); if (was !== $('#stage').className) renderAll(); }, 150); });
  setInterval(() => $$('[data-clock]').forEach((c) => { c.textContent = tm(new Date()); }), 20000);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ['A', 'B'].forEach((id) => { if (PANES[id].ui.sheet) closeSheet(id); }); });
}
init();

</script>
</body>
</html>
